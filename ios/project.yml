name: IPP
options:
  bundleIdPrefix: com.nonturing.ipp
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  IPP:
    type: application
    platform: iOS
    sources:
      - path: IPP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nonturing.ipp
        INFOPLIST_FILE: IPP/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  # Unit tests for the pure, off-device logic: the AR mini-game's rulebook
  # (toss physics, rounds, best score, podium/floor-map geometry) and the
  # backend locator / map-pin decoding. Hosted by the IPP app, so the suites
  # read the app's real Info.plist. No test needs a running backend.
  # Run: xcodebuild test -scheme IPP -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
  IPPTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IPPTests
    dependencies:
      - target: IPP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nonturing.ipp.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  IPP:
    build:
      targets:
        IPP: all
        IPPTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IPPTests
